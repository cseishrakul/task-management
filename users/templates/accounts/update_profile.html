{% extends "base.html" %} {% block content %}
<section class="container mx-auto mt-3">
  <hr />

  {% if messages %} {% for message in messages %}
  <div
    class="px-2 py-1 {% if message.tags == 'success' %} bg-green-500 {% endif %}"
  >
    {{message}}
  </div>
  {% endfor %} {% endif %}
  <div class="w-[500px] mx-auto py-5 my-5">
    <form method="POST" class="mt-3 mx-auto" enctype='multipart/form-data'>
      {% csrf_token %}{{form}}
      <input
        type="submit"
        class="btn my-5 w-full py-2 border-2 border-blue-500 rounded-md cursor-pointer hover:bg-blue-500 hover:text-white"
        name="submit"
        value="Update"
      />
    </form>
  </div>
</section>
{% endblock content %}
