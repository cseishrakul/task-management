{% extends "base.html" %} {% block content %}
<section class="container mx-auto mt-3">
  {% comment %} <h1 class="text-center text-3xl font-semibold mb-2">Sign In</h1> {% endcomment %}
  <hr />

  {% if messages %} {% for message in messages %}
  <div
    class="px-2 py-1 {% if message.tags == 'success' %} bg-green-500 {% endif %}"
  >
    {{message}}
  </div>
  {% endfor %} {% endif %}
  <div class="w-[500px] mx-auto py-5 my-5">
    <form method="POST" class="mt-3 mx-auto">
      {% csrf_token %} {% comment %}
      <div class="group">
        <label for="">Username</label>
        <input
          type="text"
          name="username"
          class="w-full border-2 border-gray-400 p-2 rounded-lg"
          placeholder="Username"
          id=""
        />
      </div>
      <div class="group">
        <label for="">Password</label>
        <input
          type="password"
          name="password"
          class="w-full border-2 border-gray-400 p-2 rounded-lg"
          placeholder="*****"
          id=""
        />
      </div>
      {% endcomment %} {{form}}
      <input
        type="submit"
        class="btn my-5 w-full py-2 border-2 border-rose-600 rounded-md cursor-pointer hover:bg-rose-600 hover:text-white"
        name="submit"
        value="Sign In"
      />
    </form>
    <p>
      <a href="{% url 'password-reset' %}" class="">Forgot Password?</a>
    </p>
  </div>
</section>
{% endblock content %}
